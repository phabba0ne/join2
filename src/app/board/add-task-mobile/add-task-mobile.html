<section>
  <div class="content">
    <div class="head">
      <div class="headline-wrap">
        <span>Add Task</span>
      </div>
    </div>
    <div class="title">
      <label for="title" class="title-lable">Title<span></span></label>
      <input type="text" placeholder="Enter a title" class="title-input" />
    </div>

    <div class="description">
      <label for="description" class="description-label">Description</label>
      <input type="text" placeholder="Enter a Description" class="description-input" />
    </div>

    <div class="date">
      <label for="due-date" class="date-lable">Due date<span></span></label>
      <input type="date" placeholder="dd/mm/yyyy" class="date-input" />
    </div>

    <div class="priority">
      <label for="priority" class="priority-label">Description</label>
      <div class="priority-content">
        <div>Urgent<img src="assets\img\board\prio-urgent.svg" /></div>
        <div>Medium<img src="assets\img\board\prio-medium.svg" /></div>
        <div>Low<img src="assets\img\board\prio-low.svg" /></div>
      </div>
    </div>

    <div class="assigned">
      <label for="assigned" class="assigned-label">Assigned to</label>
    </div>
  </div>
</section>
